plugins {
    id 'com.android.application'
}

// Release signing is opt-in. Debug always uses Android's standard debug key.
def releaseSigning = [
    storeFile: System.getenv('RELEASE_STORE_FILE'),
    storePassword: System.getenv('RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('RELEASE_KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isEmpty() }

android {
    namespace "com.acc.acc"
    compileSdk 35

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.acc.acc"
        minSdk 26
        targetSdk 34
        versionCode 22
        versionName '1.0'
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
}
