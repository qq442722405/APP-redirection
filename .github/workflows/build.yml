name: 构建 APP窗口容器 2032x960 DPI版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: 准备 APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/APP窗口容器_2032x960_DPI版.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: APP窗口容器_2032x960_DPI版
          path: output/APP窗口容器_2032x960_DPI版.apk
          if-no-files-found: error
