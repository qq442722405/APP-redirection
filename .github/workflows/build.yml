name: 构建 APP窗口启动器

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 检查工程
        run: |
          test -f Acc.jks
          test -f app/src/main/java/com/acc/acc/MainActivity.java
          if find app/src/main/java -type f -name '*.java' -print0 | xargs -0 grep -nE '^package com\\.example\\.|^package com\\.example'; then
            echo '错误：发现旧包名源码'
            exit 1
          fi
          grep -q 'namespace "com.acc.acc"' app/build.gradle
          grep -q 'applicationId "com.acc.acc"' app/build.gradle

      - name: 构建并生成指定文件名 APK
        run: |
          gradle clean :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/APP窗口启动器.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: APP窗口启动器
          path: app/build/outputs/apk/debug/APP窗口启动器.apk
          if-no-files-found: error
          retention-days: 30
