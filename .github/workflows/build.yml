name: 构建 APP窗口启动器

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 设置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: 清理旧版资源并检查工程
        shell: bash
        run: |
          # 旧提交曾经存在 shortcuts.xml，可能引用不存在的 string/reselect。
          # 当前版本不使用该资源，构建前主动删除，避免 AAPT 读取旧文件。
          find app/src/main/res -type f -name 'shortcuts.xml' -print -delete || true
          if [ -f app/src/main/res/xml/accessibility_service_config.xml ]; then
            echo '=== accessibility_service_config.xml ==='
            cat app/src/main/res/xml/accessibility_service_config.xml
          fi
          echo '=== Java source ==='
          find app/src/main/java -type f -name '*.java' -print
          echo '=== XML resources ==='
          find app/src/main/res -type f -name '*.xml' -print

      - name: 最终资源检查
        shell: bash
        run: |
          echo '=== 检查 shortcuts.xml ==='
          if find app/src/main/res -type f -name 'shortcuts.xml' | grep -q .; then
            echo 'ERROR: 不允许存在旧 shortcuts.xml'
            exit 1
          fi
          echo '=== accessibility_service_config.xml ==='
          cat app/src/main/res/xml/accessibility_service_config.xml
          echo '=== strings.xml ==='
          cat app/src/main/res/values/strings.xml

      - name: 构建 Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --version
          gradle clean :app:assembleDebug --no-daemon --stacktrace


      - name: 准备 APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/APP窗口启动器.apk"
          ls -lh output/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: APP窗口启动器
          path: output/APP窗口启动器.apk
          if-no-files-found: error
