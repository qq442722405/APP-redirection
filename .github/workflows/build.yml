name: 构建 Acc 安卓12权限增强版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 检查签名文件
        run: |
          test -f Acc.jks
          ls -lh Acc.jks

      - name: 检查包名
        run: |
          grep -R 'applicationId' app*/build.gradle app/build.gradle 2>/dev/null || true
          grep -R 'namespace' app*/build.gradle app/build.gradle 2>/dev/null || true

      - name: 构建 Debug APK
        run: gradle clean :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Acc-Android12
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
