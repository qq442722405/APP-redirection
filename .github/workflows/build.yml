name: 构建 APP窗口容器 窗口模式_自动保存版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 设置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 检查工程结构
        shell: bash
        run: |
          if find app/src/main/java -type f -path '*com/example/carappjump/*' | grep -q .; then
            echo "检测到旧版 carappjump 源码，构建前删除"
            rm -rf app/src/main/java/com/example/carappjump
          fi
          echo "=== 当前 Java 源文件 ==="
          find app/src/main/java -type f -name '*.java' -print

      - name: 构建 Debug APK
        run: gradle clean :app:assembleDebug --no-daemon --stacktrace --info --console=plain

      - name: 检查构建输出
        if: always()
        run: |
          echo "=== APK 输出 ==="
          find app/build/outputs -type f -name "*.apk" -print 2>/dev/null || true

      - name: 准备 APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/APP窗口容器_窗口模式_自动保存版.apk"
          ls -lh output/

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APP窗口容器_触控修复_间距快速调整版
          path: output/APP窗口容器_窗口模式_自动保存版.apk
          if-no-files-found: error
